name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Type check (// @ts-check)
        run: npm run typecheck
      - name: Static checks
        run: node scripts/check.mjs
